<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bestillinger – Re:textile</title>
  <meta name="description" content="Bestillinger fra kommunene til Re:textile. Bekreft, marker som sendt og levert." />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Hopp til innhold</a>

  <div id="app-header"></div>

  <main id="main">
    <h1 class="page-title">Bestillinger</h1>
    <p class="page-lead">Bestillinger fra kommunene. Bekreft, marker som sendt og til slutt som levert.</p>

    <ul class="order-list" id="order-list" aria-label="Bestillingsliste"></ul>
    <p id="empty-orders" class="empty-state" hidden>Ingen bestillinger ennå.</p>
  </main>

  <footer class="site-footer">
    Demo – ingen data lagres utenfor denne nettleseren.
  </footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    const NEXT_LABEL = {
      Venter: "Bekreft bestilling",
      Bekreftet: "Marker som sendt",
      Sendt: "Marker som levert",
    };

    function renderOrders() {
      const list = document.getElementById("order-list");
      const emptyMsg = document.getElementById("empty-orders");
      const orders = Store.getOrders();

      list.innerHTML = "";
      emptyMsg.hidden = orders.length !== 0;

      orders.forEach((order) => {
        const total = order.items.reduce((sum, i) => sum + i.quantity * i.price, 0);
        const nextLabel = NEXT_LABEL[order.status];
        const li = document.createElement("li");
        li.className = "order-card";
        li.innerHTML = `
          <div class="order-card-header">
            <div>
              <span class="order-id">${escapeHtml(order.id)}</span>
              <span class="order-meta"> · ${order.date} · Fra ${escapeHtml(order.buyer)}</span>
            </div>
            <span class="status-pill" data-status="${order.status}">${order.status}</span>
          </div>
          <ul class="order-items">
            ${order.items
              .map(
                (i) => `<li><span>${i.quantity} × ${escapeHtml(i.title)}</span><span>${Store.formatPrice(i.quantity * i.price)}</span></li>`
              )
              .join("")}
          </ul>
          <div class="summary-row total"><span>Totalt</span><span>${Store.formatPrice(total)}</span></div>
          ${
            nextLabel
              ? `<div class="card-actions"><button class="btn btn-primary btn-sm" type="button" data-advance="${order.id}">${nextLabel}</button></div>`
              : ""
          }
        `;
        list.appendChild(li);
      });

      list.querySelectorAll("[data-advance]").forEach((btn) => {
        btn.addEventListener("click", () => {
          Store.advanceOrder(btn.dataset.advance);
          renderOrders();
        });
      });
    }

    if (initPage("admin", "bestillinger")) {
      renderOrders();
    }
  </script>
</body>
</html>
