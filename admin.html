<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oversikt – Re:textile</title>
  <meta name="description" content="Re:textile-administrasjon: status for varemottak, lager og bestillinger." />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Hopp til innhold</a>

  <div id="app-header"></div>

  <main id="main">
    <h1 class="page-title">Oversikt</h1>
    <p class="page-lead">Status for varemottak, lager og bestillinger fra kommunene.</p>

    <div class="stat-grid" id="stat-grid"></div>

    <div class="dashboard-cols">
      <section class="panel" aria-labelledby="panel-intake">
        <h2 id="panel-intake">Siste varemottak</h2>
        <ul class="mini-list" id="mini-intake"></ul>
        <a class="panel-link" href="admin-varemottak.html">Gå til varemottak →</a>
      </section>

      <section class="panel" aria-labelledby="panel-orders">
        <h2 id="panel-orders">Siste bestillinger</h2>
        <ul class="mini-list" id="mini-orders"></ul>
        <a class="panel-link" href="admin-bestillinger.html">Gå til bestillinger →</a>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    Demo – ingen data lagres utenfor denne nettleseren.
  </footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    function renderDashboard() {
      const s = Store.stats();
      document.getElementById("stat-grid").innerHTML = [
        [s.intakeInProgress, "Plagg under behandling"],
        [s.intakeReady, "Klar for utlegging"],
        [s.stockUnits, "Varer på lager"],
        [s.openOrders, "Åpne bestillinger"],
      ]
        .map(
          ([value, label]) =>
            `<div class="stat-card"><div class="stat-value">${value}</div><div class="stat-label">${label}</div></div>`
        )
        .join("");

      const intake = Store.getIntake().slice(0, 5);
      document.getElementById("mini-intake").innerHTML = intake.length
        ? intake
            .map(
              (i) =>
                `<li><span>${i.quantity} × ${escapeHtml(i.title)} <span class="muted">· ${escapeHtml(i.origin)}</span></span><span class="muted">${i.status}</span></li>`
            )
            .join("")
        : `<li><span class="muted">Ingen plagg i mottak.</span></li>`;

      const orders = Store.getOrders().slice(0, 5);
      document.getElementById("mini-orders").innerHTML = orders.length
        ? orders
            .map(
              (o) =>
                `<li><span>${escapeHtml(o.id)} <span class="muted">· ${escapeHtml(o.buyer)}</span></span><span class="muted">${o.status}</span></li>`
            )
            .join("")
        : `<li><span class="muted">Ingen bestillinger ennå.</span></li>`;
    }

    if (initPage("admin", "oversikt")) {
      renderDashboard();
    }
  </script>
</body>
</html>
