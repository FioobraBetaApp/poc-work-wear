<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Butikk – Arbeidstøybørsen</title>
  <meta name="description" content="Bla gjennom arbeidstøy Re:textile har kontrollert og lagt ut for salg." />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Hopp til innhold</a>

  <div id="app-header"></div>

  <main id="main">
    <h1 class="page-title">Butikk</h1>
    <p class="page-lead">Bla gjennom arbeidstøy Re:textile har tatt imot, kontrollert og lagt ut for salg. Velg antall og legg i handlekurven.</p>

    <div class="filters" role="group" aria-label="Filtrer etter kategori">
      <button class="filter-btn" type="button" data-filter="Alle" aria-pressed="true">Alle</button>
      <button class="filter-btn" type="button" data-filter="Vernebekledning" aria-pressed="false">Vernebekledning</button>
      <button class="filter-btn" type="button" data-filter="Overdeler" aria-pressed="false">Overdeler</button>
      <button class="filter-btn" type="button" data-filter="Underdeler" aria-pressed="false">Underdeler</button>
    </div>

    <ul class="listing-grid" id="listing-grid" aria-label="Varer til salgs"></ul>
    <p id="empty-message" class="empty-state" hidden>Ingen varer i denne kategorien akkurat nå.</p>
  </main>

  <footer class="site-footer">
    Demo – ingen data lagres utenfor denne nettleseren.
  </footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    let activeFilter = "Alle";

    function renderListings() {
      const grid = document.getElementById("listing-grid");
      const emptyMsg = document.getElementById("empty-message");
      const listings = Store.getListings().filter(
        (l) => activeFilter === "Alle" || l.category === activeFilter
      );

      grid.innerHTML = "";
      emptyMsg.hidden = listings.length !== 0;

      listings.forEach((listing) => {
        const soldOut = listing.quantity <= 0;
        const li = document.createElement("li");
        li.className = "listing-card";
        li.innerHTML = `
          <img src="${placeholderImage(listing.category)}" alt="Illustrasjonsbilde av ${escapeHtml(listing.title)}" />
          <div class="listing-body">
            <div class="listing-top-row">
              <h2 class="listing-title">${escapeHtml(listing.title)}</h2>
              <span class="listing-price">${Store.formatPrice(listing.price)}</span>
            </div>
            <div class="tag-row">
              <span class="category-tag" data-category="${listing.category}">${listing.category}</span>
              <span class="condition-tag">${escapeHtml(listing.condition || "Kontrollert")}</span>
            </div>
            <p class="listing-meta">
              <span>Str. ${escapeHtml(listing.size)}</span>
              <span>${listing.quantity} stk. tilgjengelig</span>
              <span>Fra ${escapeHtml(listing.origin)}</span>
            </p>
            <p class="listing-desc">${escapeHtml(listing.description)}</p>
            <div class="listing-footer">
              ${
                soldOut
                  ? `<span class="own-tag">Utsolgt</span>`
                  : `
                <div class="qty-field">
                  <label for="qty-${listing.id}">Antall</label>
                  <input type="number" id="qty-${listing.id}" min="1" max="${listing.quantity}" value="1" />
                </div>
                <button class="btn btn-primary" type="button" data-add="${listing.id}">Legg i kurv</button>
              `
              }
            </div>
          </div>
        `;
        grid.appendChild(li);
      });

      grid.querySelectorAll("[data-add]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = Number(btn.dataset.add);
          const qtyInput = document.getElementById(`qty-${id}`);
          let qty = parseInt(qtyInput.value, 10);
          if (!Number.isFinite(qty) || qty < 1) qty = 1;
          Store.addToCart(id, qty);
          Store.updateCartBadge();
          const listing = Store.getListing(id);
          showToast(`${qty} × ${listing.title} lagt i handlekurven`);
        });
      });
    }

    document.querySelectorAll(".filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach((b) => b.setAttribute("aria-pressed", "false"));
        btn.setAttribute("aria-pressed", "true");
        activeFilter = btn.dataset.filter;
        renderListings();
      });
    });

    if (initPage("buyer", "butikk")) {
      renderListings();
    }
  </script>
</body>
</html>
